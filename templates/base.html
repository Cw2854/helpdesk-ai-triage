<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ company_name }} {{ portal_name }}{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}?v=2" sizes="any">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon-32.png') }}?v=2">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block content %}{% endblock %}
  {% block footer %}
  <footer class="site-footer">
    A demo portfolio project by {{ author_name }}. {{ company_name }} is a made-up company.
    <a href="{{ project_url }}">See the code</a>
  </footer>
  {% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
